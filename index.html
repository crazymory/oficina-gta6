<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070B">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="La planta de la oficina de clips de GTA VI en versión videojuego: cada agente en su mesa con su estado real, Genio coordinando en el centro y el trabajo pasando de mesa en mesa.">
  <title>Oficina virtual de clips CrazyMory</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <header class="page-head">
    <div class="live-badge" id="live-badge" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="live-text">Conectando…</span>
    </div>
    <div class="office-sign" id="office-sign" hidden></div>
    <h1>Oficina virtual de clips CrazyMory</h1>
  </header>

  <main>
    <section class="block" aria-labelledby="planta-title">
      <h2 id="planta-title" class="sr-only">La planta</h2>
      <div class="game" id="game">
        <div id="hud"></div>
        <div class="toolbar" hidden style="display:none">
          <span class="stamp" id="updated-stamp">Cargando estado…</span>
          <button type="button" id="demo-btn" class="btn">Ver demo del flujo</button>
        </div>
        <p class="demo-note" id="demo-note" hidden>Demostración del recorrido de un clip. No es actividad real.</p>
        <div class="office-wrap" id="office-wrap">
          <svg id="office" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planta de la oficina de clips con los agentes en sus mesas"></svg>
        </div>
        <div class="chips" id="chips"></div>
        <div id="panel"></div>
      </div>
    </section>
  </main>

  <a class="jojo-float" href="grokbot://app/v1/agent?id=6afd7123-abe9-417e-8fef-c09903ffbca8" aria-label="Hablar con Genio">Hablar con Genio</a>

  <script src="office.js?v=10" defer></script>
</body>
</html>
